name: Release

# Builds the Windows installer when a version tag (v1.2.3, or a prerelease like v1.3.0-beta.3) is
# pushed, and attaches it to a draft GitHub release with its SHA-256 checksum, plus latest.yml and
# the blockmap that the in-app updater reads. A tag with a hyphen is marked as a prerelease. Publish
# the draft by hand after checking it: installed copies only see published releases. If a release
# for the tag already exists (one published by hand first), only the files it lacks are added.
#
# Two jobs, so build code never holds a token that can write releases: the build job (which runs
# every npm package's install and build scripts) only has read access and keeps no credentials;
# the release job only downloads the finished files and creates the draft. It runs no npm at all.
# Actions are pinned to commit SHAs (the tag each one was is in the comment).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix ui audit --omit=dev --audit-level=high

      - name: Test
        # Real-window tests (test/*-win.test.js, desktop-uia, focus-guard's "for real") skip
        # themselves when CI is set: a hosted runner has no interactive desktop they can rely on.
        env:
          CI: 'true'
        run: npm test

      - name: Build UI and installer
        run: npm run dist

      - name: Checksum
        shell: pwsh
        run: |
          if (-not (Test-Path dist/latest.yml)) { throw 'latest.yml missing: installed copies could not update to this release' }
          $exe = Get-ChildItem dist/Orbit-Setup-*.exe | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "dist/$($exe.Name).sha256"
          "Installer SHA-256: $hash"
          Copy-Item RELEASE_NOTES.md dist/RELEASE_NOTES.md

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: orbit-installer
          if-no-files-found: error
          path: |
            dist/Orbit-Setup-*.exe
            dist/Orbit-Setup-*.exe.sha256
            dist/Orbit-Setup-*.exe.blockmap
            dist/latest.yml
            dist/RELEASE_NOTES.md

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: orbit-installer
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }} # passed as data, never pasted into the script
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          files=(dist/Orbit-Setup-*.exe dist/Orbit-Setup-*.exe.sha256 dist/Orbit-Setup-*.exe.blockmap dist/latest.yml)
          for f in "${files[@]}"; do [[ -f "$f" ]] || { echo "Missing from the build: $f"; exit 1; }; done
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi

          if view_err="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>&1 >"$RUNNER_TEMP/existing.txt")"; then
            echo "A release for $TAG already exists; adding only the files it doesn't have."
            missing=()
            for f in "${files[@]}"; do
              name="$(basename "$f")"
              if grep -Fxq -- "$name" "$RUNNER_TEMP/existing.txt"; then echo "Already attached, left as is: $name"; else missing+=("$f"); fi
            done
            if (( ${#missing[@]} )); then
              gh release upload "$TAG" "${missing[@]}" # no --clobber: never replaces a file already there
            else
              echo "Nothing to add: the release for $TAG already has every file."
            fi
          elif [[ "$view_err" == *"release not found"* ]]; then
            gh release create "$TAG" "${files[@]}" --draft "${prerelease[@]}" \
              --title "Orbit $TAG" --notes-file dist/RELEASE_NOTES.md
          else
            echo "Could not check for an existing release for $TAG: $view_err"
            exit 1
          fi
